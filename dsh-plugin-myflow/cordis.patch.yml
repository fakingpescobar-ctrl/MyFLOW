# Патч-слой плагина MyFLOW: добавляет одну строку в дерево профиля.
#
# `insert` кладёт наш плагин в собранное дерево DSH; строка связывает id с именем
# npm-пакета (он установлен в профиле как связь на dsh-plugin-myflow).
# Сам плагин живёт в index.js и слушает файл-инбокс от MyFLOW.
- insert:
    - id: myflow-bridge
      name: 'dsh-plugin-myflow'
